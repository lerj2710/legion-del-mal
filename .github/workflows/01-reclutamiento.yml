name: Reclutamiento de agente

on:  push

jobs: 
    reporte-de-reclutamiento:
        runs-on: ubuntu-latest

        steps:
            - name: Agente se presenta
              run: echo "Hola, soy Lex Lutor el reclutador de la lengion del mal."

            - name: Reporte de Identidad
              run: |
                echo "Nombre: Lex Lutor"
                echo "==================="
                echo ""
                echo "Nombre clave ${{ github.actor }}"
                echo ""
                echo "Conesto de github"
                echo "Repo: ${{github.repository}}"
                echo "Operacion: $${{github.sha}}"
                echo "MetaData: $${{ toJson(github) }}"
                echo ""
                echo "Edad: 45"
                echo "Poderes: Genio, riqueza, manipulación"
                echo "Objetivo: Reclutar a los mejores agentes para la legión del mal."
