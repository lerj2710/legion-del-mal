              echo "3. Recursos ilimitados"
              echo "4. Manipulación y persuasión"
              node --version
              echo "5. Experiencia en combate y tecnología avanzada"

          - name: Reconocimiento del terreno
            run: |
              echo "Reconociendo el terreno de reclutamiento..."
              ls / 
           