            run: echo "Hola, soy Lex Lutor el reclutador de la lengion del mal."

          - name: Reporte de Identidad
            run: |
              echo "Nombre: Lex Lutor"
              echo "==================="
              echo ""
              echo "Nombre clave ${{ github.actor }}"
              echo ""
              echo "Conesto de github"
              echo "Repo: ${{ github.repository }}"
              echo "Operacion: ${{ github.sha }}"                
              echo 'MetaData: ${{ toJson(github) }}'          
              echo ""
