name: Comunicador de la legión del mal


on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'Que villano envia el mensaje'
        required: true
        type: choice
        options:
          - Lex Lutor
          - Jocker
          - Magnecto
      mensaje:
        description: 'Mensaje a enviar al consejo'
        required: true
        type: string

      prioridad:
        description: 'Nivel de Prioridad del mensaje'
        required: true
        type: choice
        options:
          - Normal
          - Media
          - Alta
          - Critica



jobs:

  trasmitir-mensaje:
      runs-on: ubuntu-latest

      steps:
        - name: Instalar trasmisor de la legion
          run: sudo apt-get install -y cowsay

       #- uses: actions/checkout@v4       
        - name: Imprimir  mensaje al consejo
          run: |
            echo "=================================================="
            echo " Trasmitiendo mensaje al consejo de villanos     "
            echo "=================================================="       
            echo " "     
            echo "De: ${{ github.event.inputs.villano }}"     
            echo " "     
            echo "fecha: $(date +'%d/%m/%Y %H:%M:%S')"     
            echo "------- Mensaje-------"      
            echo " " 
            cowsay -f eyes ${{ github.event.inputs.mensaje }}    
            echo " "     
            echo " "   
            echo " ${{ github.event.inputs.villano }}"  
            echo " "     

     